<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/favicon.png" />
    <title>Med Tabs Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="med-tab-parser.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <span class="app-brand">Med Tabs Generator</span>
        <div class="app-header-actions">
          <button id="copyBlankTemplateBtn" class="blank-template-btn" type="button">Copy Blank Template</button>
          <div class="theme-picker">
            <button id="themeToggle" class="theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu">
              <span aria-hidden="true">🎨</span><span id="themeLabel">Theme</span><span class="theme-menu-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="themeMenu" class="theme-menu" role="menu" aria-label="Choose theme" hidden>
              <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="light"><span aria-hidden="true">☀️</span><span>Light</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="dark"><span aria-hidden="true">🌙</span><span>Dark</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="sepia"><span aria-hidden="true">📜</span><span>Sepia</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="forest"><span aria-hidden="true">🌲</span><span>Forest</span><span class="theme-check" aria-hidden="true">✓</span></button>
              <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="blossom"><span aria-hidden="true">🌸</span><span>Blossom</span><span class="theme-check" aria-hidden="true">✓</span></button>
            </div>
          </div>
        </div>
      </header>

      <section class="panel input-panel" aria-labelledby="generator-title">
        <div class="panel-heading">
          <h1 id="generator-title">Med Tabs Generator</h1>
          </p>
        </div>

        <label class="sr-only" for="inputText">Raw intake text</label>
        <textarea id="inputText" placeholder="Paste intake text here..."></textarea>

        <div class="input-actions">
          <button id="generateBtn" class="primary-btn" type="button">Generate Med Tabs</button>
        </div>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
      </section>

      <section class="panel output-panel" aria-labelledby="results-title">
        <div class="output-header">
          <div class="output-title">
            <h2 id="results-title">Medical Provider Tabs</h2>
          </div>
          <div class="output-header-actions">
            <div id="validationCounters" class="validation-counters" aria-label="Provider validation summary" aria-live="polite">
              <span id="resultCount" class="counter-pill counter-pill-providers" data-counter-status="all">0 Providers</span>
              <span id="greenCount" class="counter-pill counter-pill-complete" data-counter-status="complete" hidden></span>
              <span id="yellowCount" class="counter-pill counter-pill-warning" data-counter-status="warning" hidden></span>
              <span id="redCount" class="counter-pill counter-pill-critical" data-counter-status="critical" hidden></span>
              <span id="duplicateCount" class="counter-pill counter-pill-duplicate" data-counter-status="duplicate" hidden></span>
            </div>
            <button id="clearAllBtn" class="clear-btn" type="button" disabled>Clear All</button>
          </div>
        </div>

        <div id="resultsContainer" class="results-stack">
          <div class="empty-state">
            <h3>Ready to generate</h3>
            <p>Paste intake text from one or more providers and generate polished output cards on the right.</p>
          </div>
        </div>
      </section>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  </body>
</html>
