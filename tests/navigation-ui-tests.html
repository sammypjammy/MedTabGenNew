<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Toolkit Navigation UI Tests</title>
    <script src="../med-tab-parser.js"></script>
    <script src="../script.js" defer></script>
  </head>
  <body>
    <button id="appMenuToggle" type="button" aria-expanded="false" aria-controls="appMenu">Menu</button>
    <div id="appMenuBackdrop" hidden></div>
    <aside id="appMenu" hidden>
      <button id="appMenuClose" type="button">Close</button>
      <nav id="toolkitNavigation"></nav>
    </aside>

    <textarea id="inputText"></textarea>
    <button id="generateBtn" type="button">Generate</button>
    <div id="statusMessage"></div>
    <div class="output-panel"><div id="resultsContainer"></div></div>
    <span id="resultCount"></span><span id="greenCount"></span><span id="yellowCount"></span><span id="redCount"></span><span id="duplicateCount"></span>
    <button id="copyBlankTemplateBtn" type="button"></button><button id="clearAllBtn" type="button"></button>
    <div id="toastContainer"></div>
    <div id="testSummary">RUNNING</div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const failures = [];
        const expect = (condition, message) => { if (!condition) failures.push(message); };
        const links = [...toolkitNavigation.querySelectorAll('a')];

        expect(links.length === 2, 'only configured tools are links');
        expect(links[0]?.href === 'https://cannedremarks.vercel.app/', 'Canned Remarks URL');
        expect(links[1]?.href === 'https://welcome-email-sender.vercel.app/', 'Welcome Emails URL');
        expect(toolkitNavigation.querySelector('[aria-current="page"]')?.textContent.includes('Med Tabs'), 'current tool highlighted');
        expect(toolkitNavigation.querySelectorAll('[aria-disabled="true"]').length === 3, 'unconfigured tools disabled');

        appMenuToggle.click();
        expect(!appMenu.hidden && !appMenuBackdrop.hidden, 'menu and backdrop open');
        expect(document.body.classList.contains('menu-open'), 'page scrolling locked');
        expect(document.activeElement === appMenuClose, 'focus moves into drawer');

        appMenuBackdrop.click();
        expect(appMenu.hidden && appMenuBackdrop.hidden, 'backdrop closes drawer');
        expect(document.activeElement === appMenuToggle, 'backdrop close restores focus');

        appMenuToggle.click();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        expect(appMenu.hidden && document.activeElement === appMenuToggle, 'Escape closes and restores focus');

        testSummary.textContent = failures.length ? `FAIL: ${failures.join(', ')}` : 'PASS: toolkit navigation UI';
      });
    </script>
  </body>
</html>
