<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Duplicate Provider UI Tests</title>
    <script src="../med-tab-parser.js"></script>
    <script src="../script.js" defer></script>
  </head>
  <body>
    <button id="themeToggle" type="button"><span id="themeLabel"></span></button>
    <textarea id="inputText"></textarea>
    <button id="generateBtn" type="button">Generate</button>
    <div id="statusMessage"></div>
    <div class="output-panel"><div id="resultsContainer"></div></div>
    <span id="resultCount"></span>
    <span id="greenCount"></span>
    <span id="yellowCount"></span>
    <span id="redCount"></span>
    <span id="duplicateCount" hidden></span>
    <button id="copyBlankTemplateBtn" type="button"></button>
    <button id="clearAllBtn" type="button"></button>
    <div id="toastContainer"></div>
    <div id="testSummary">RUNNING</div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const failures = [];
        const expect = (condition, message) => { if (!condition) failures.push(message); };

        expect(normalizePhoneForDuplicateCheck('+1 (210) 555-0123') === '2105550123', 'phone normalization');
        expect(normalizePhoneForDuplicateCheck('1-210-555-0123') === '', 'bare country code remains invalid');
        expect(normalizePhoneForDuplicateCheck('Unknown') === '', 'invalid phone ignored');
        expect(
          normalizeAddressForDuplicateCheck(' 100 North Main Street, Suite 2. Austin, TX 78701 ') ===
            normalizeAddressForDuplicateCheck('100 N Main St Ste 2 Austin TX 78701'),
          'address abbreviation normalization'
        );
        expect(normalizeAddressForDuplicateCheck('Not provided') === '', 'generic address ignored');
        expect(normalizeAddressForDuplicateCheck('Not provided, Austin, TX 78701') === '', 'generic address component ignored');

        const recycledProviders = [
          { id: 1, fields: { phone: '210-555-0100', address: '1 Main St, Austin, TX 78701' } },
          { id: 2, fields: { phone: '210-555-0100', address: '1 Main Street, Austin, TX 78701' } }
        ];
        markDuplicateGroups(recycledProviders);
        expect(recycledProviders.every((provider) => provider.duplicate), 'initial batch marked');
        recycledProviders[1].fields.phone = '210-555-0199';
        markDuplicateGroups(recycledProviders);
        expect(recycledProviders.every((provider) => !provider.duplicate), 'regeneration clears stale duplicate state');

        inputText.value = `Clinic 1
Clinic Name: Alpha Clinic
Doctor First Name: Alex
Doctor Last Name: One
Phone: (210) 555-0123
Address: 100 North Main Street, Suite 2
City: Austin
State: TX
Zip: 78701
First Visit: 01/2024
Last Visit: 02/2025

Clinic 2
Clinic Name: Totally Different Clinic
Doctor First Name: Blair
Doctor Last Name: Two
Phone: +1 210.555.0123
Address: 100 N Main St Ste 2
City: Austin
State: TX
Zip: 78701
First Visit: 01/2024
Last Visit: 02/2025

Clinic 3
Clinic Name: Third Name
Phone: 210-555-0123
Address: 100 N Main St Ste 2
City: Austin
State: TX
Zip: 78701
First Visit: 01/2024
Last Visit: 02/2025

Clinic 4
Clinic Name: Different Address
Phone: 210-555-0123
Address: 200 N Main St Ste 2
City: Austin
State: TX
Zip: 78701
First Visit: 01/2024
Last Visit: 02/2025

Clinic 5
Clinic Name: Invalid Phone
Phone: Unknown
Address: 100 N Main St Ste 2
City: Austin
State: TX
Zip: 78701
First Visit: 01/2024
Last Visit: 02/2025`;
        generateBtn.click();

        window.setTimeout(() => {
          const cards = [...document.querySelectorAll('.provider-card')];
          expect(cards.length === 5, 'five providers retained');
          expect(document.querySelectorAll('.status-badge-duplicate').length === 3, 'all duplicate group members badged');
          expect(duplicateCount.dataset.count === '3', 'duplicate counter counts every group member');
          expect(!duplicateCount.hidden, 'duplicate counter visible');
          expect(!cards[0]?.querySelector('.duplicate-reference'), 'original has no duplicate-of label');
          expect(cards[1]?.querySelector('.duplicate-reference')?.textContent === 'Duplicate of Provider 1', 'second references original');
          expect(cards[2]?.querySelector('.duplicate-reference')?.textContent === 'Duplicate of Provider 1', 'third references original');
          expect(cards[1]?.querySelector('.duplicate-details')?.textContent.includes('Phone number'), 'details list phone match');
          expect(cards[1]?.querySelector('.duplicate-details')?.textContent.includes('Address'), 'details list address match');
          expect(cards[1]?.querySelector('.status-badge-complete'), 'validation badge retained');
          expect(cards.every((card) => card.querySelector('[data-action="copy"]')), 'copy remains available');

          clearAllBtn.click();
          expect(document.querySelectorAll('.status-badge-duplicate').length === 0, 'clear removes duplicate flags');
          expect(duplicateCount.hidden, 'clear hides duplicate counter');

          testSummary.textContent = failures.length ? `FAIL: ${failures.join(', ')}` : 'PASS: duplicate provider UI';
          testSummary.className = failures.length ? 'fail' : 'pass';
        }, 800);
      });
    </script>
  </body>
</html>
