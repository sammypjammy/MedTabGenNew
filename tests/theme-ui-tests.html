<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>Theme UI Tests</title>
    <link rel="stylesheet" href="../styles.css" />
    <script>localStorage.removeItem('med-tabs-theme');</script>
    <script src="../med-tab-parser.js"></script>
    <script src="../script.js" defer></script>
  </head>
  <body>
    <div class="theme-picker">
      <button id="themeToggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu">🎨 Theme</button>
      <div id="themeMenu" role="menu" hidden>
        <button class="theme-option" type="button" role="menuitemradio" data-theme-option="light">Light</button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme-option="dark">Dark</button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme-option="sepia">Sepia</button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme-option="forest">Forest</button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme-option="blossom">Blossom</button>
      </div>
    </div>
    <textarea id="inputText"></textarea>
    <button id="generateBtn" type="button"></button>
    <div id="statusMessage"></div>
    <div class="output-panel"><div id="resultsContainer"></div></div>
    <span id="resultCount"></span><span id="greenCount"></span><span id="yellowCount"></span><span id="redCount"></span><span id="duplicateCount"></span>
    <button id="copyBlankTemplateBtn" type="button"></button><button id="clearAllBtn" type="button"></button>
    <div id="toastContainer"></div>
    <div id="testSummary">RUNNING</div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const failures = [];
        const expect = (condition, message) => { if (!condition) failures.push(message); };
        const option = (theme) => document.querySelector(`[data-theme-option="${theme}"]`);

        expect(document.documentElement.dataset.theme === 'light', 'starts in light theme');
        expect(option('light').getAttribute('aria-checked') === 'true', 'active theme is checked');
        expect(document.querySelectorAll('[data-theme-option]').length === 5, 'all theme options exist');

        const palettes = {
          sepia: ['#F4EEDF', '#FFF8EB', '#F8EEDC', '#3B2F24', '#735F4B', '#9A6C35', '#EAD8BD', '#D8C4A7'],
          forest: ['#EDF4EF', '#FFFFFF', '#F4F8F5', '#183326', '#5B7465', '#3F7D58', '#DDECE2', '#C8DDD0'],
          blossom: ['#FDF4F8', '#FFFFFF', '#FAF1FB', '#342238', '#7A637D', '#B65FCF', '#F0DDF4', '#EBCBEF']
        };
        const paletteVariables = ['--page-bg', '--panel-bg', '--surface-bg', '--text', '--text-muted', '--accent', '--accent-soft', '--border'];
        Object.entries(palettes).forEach(([theme, expectedColors]) => {
          themeController.apply(theme);
          const styles = getComputedStyle(document.documentElement);
          expect(
            paletteVariables.every((variable, index) => styles.getPropertyValue(variable).trim().toUpperCase() === expectedColors[index]),
            `${theme} palette values`
          );
        });
        themeController.apply('light');

        themeToggle.click();
        expect(!themeMenu.hidden && themeToggle.getAttribute('aria-expanded') === 'true', 'button opens menu');
        option('sepia').click();
        expect(document.documentElement.dataset.theme === 'sepia', 'selection applies immediately');
        expect(localStorage.getItem('med-tabs-theme') === 'sepia', 'selection persists');
        expect(themeMenu.hidden && option('sepia').getAttribute('aria-checked') === 'true', 'selection checks item and closes menu');

        themeController.apply(themeController.getInitialTheme());
        expect(document.documentElement.dataset.theme === 'sepia', 'stored theme restores');

        themeToggle.click();
        document.body.click();
        expect(themeMenu.hidden, 'outside click closes menu');

        themeToggle.click();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        expect(themeMenu.hidden && document.activeElement === themeToggle, 'Escape closes menu and restores focus');

        themeToggle.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        expect(!themeMenu.hidden && document.activeElement === option('sepia'), 'arrow key opens menu at active option');
        themeMenu.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        expect(document.activeElement === option('forest'), 'arrow keys navigate options');

        testSummary.textContent = failures.length ? `FAIL: ${failures.join(', ')}` : 'PASS: theme UI';
        testSummary.className = failures.length ? 'fail' : 'pass';
      });
    </script>
  </body>
</html>
